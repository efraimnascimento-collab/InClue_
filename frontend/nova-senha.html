
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova senha | InClue</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.10);
        }

        h1 {
            margin-top: 0;
            text-align: center;
            color: #267342;
            font-size: 27px;
        }

        p {
            line-height: 1.6;
            color: #555;
        }

        label {
            display: block;
            margin: 20px 0 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #267342;
            border-color: transparent;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #267342;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1e5c34;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #mensagem {
            overflow-wrap: anywhere;
            font-size: 14px;
        }

        .voltar {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #267342;
            text-decoration: none;
        }

        .voltar:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Crie uma nova senha</h1>

        <p>
            Digite sua nova senha e confirme para recuperar
            o acesso à sua conta.
        </p>

        <form id="formNovaSenha">
            <label for="novaSenha">Nova senha</label>

            <input
                type="password"
                id="novaSenha"
                name="novaSenha"
                placeholder="Digite a nova senha"
                minlength="8"
                maxlength="72"
                autocomplete="new-password"
                required
            >

            <label for="confirmarSenha">Confirmar nova senha</label>

            <input
                type="password"
                id="confirmarSenha"
                name="confirmarSenha"
                placeholder="Digite a senha novamente"
                minlength="8"
                maxlength="72"
                autocomplete="new-password"
                required
            >

            <button type="submit" id="botaoSalvar">
                Redefinir senha
            </button>

            <p id="mensagem" role="status" aria-live="polite"></p>
        </form>

        <a class="voltar" href="login.html">
            Voltar para o login
        </a>
    </main>

    <script>
        const formulario = document.getElementById("formNovaSenha");
        const campoSenha = document.getElementById("novaSenha");
        const campoConfirmacao = document.getElementById("confirmarSenha");
        const mensagem = document.getElementById("mensagem");
        const botao = document.getElementById("botaoSalvar");

        const parametros = new URLSearchParams(window.location.search);
        const token = parametros.get("token");

        if (!token) {
            mensagem.textContent =
                "Link inválido ou incompleto. Solicite uma nova recuperação de senha.";

            mensagem.style.color = "#c62828";
            botao.disabled = true;
        }

        formulario.addEventListener("submit", async function(evento) {
            evento.preventDefault();

            const novaSenha = campoSenha.value;
            const confirmarSenha = campoConfirmacao.value;

            mensagem.textContent = "";

            if (!token) {
                mensagem.textContent =
                    "Solicite um novo link de recuperação.";

                mensagem.style.color = "#c62828";
                return;
            }

            if (novaSenha.length < 8) {
                mensagem.textContent =
                    "A senha deve ter pelo menos 8 caracteres.";

                mensagem.style.color = "#c62828";
                return;
            }

            if (novaSenha !== confirmarSenha) {
                mensagem.textContent =
                    "As senhas não são iguais.";

                mensagem.style.color = "#c62828";
                return;
            }

            botao.disabled = true;
            botao.textContent = "Salvando...";

            try {
                const resposta = await fetch(
                    "http://localhost:3000/redefinir-senha",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            token: token,
                            novaSenha: novaSenha
                        })
                    }
                );

                const dados = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(
                        dados.mensagem ||
                        "Não foi possível redefinir a senha."
                    );
                }

                mensagem.textContent =
                    dados.mensagem ||
                    "Senha redefinida com sucesso!";

                mensagem.style.color = "#267342";

                formulario.reset();
                campoSenha.disabled = true;
                campoConfirmacao.disabled = true;

                botao.textContent = "Senha redefinida";

            } catch (erro) {
                mensagem.textContent =
                    erro.message === "Failed to fetch"
                        ? "Não foi possível conectar ao servidor. Verifique se o backend está rodando."
                        : erro.message;

                mensagem.style.color = "#c62828";
                botao.disabled = false;
                botao.textContent = "Redefinir senha";
            }
        });
    </script>
</body>
</html>
