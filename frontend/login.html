<!DOCTYPE html>

    <header>

        <h1>InClue</h1>

        <nav>
            <a href="index.html">Home</a>

            <a href="sobre.html">Sobre</a>

        </nav>

    </header>


    <!-- ==============================
         FORMULÁRIO DE LOGIN
    =============================== -->

    <form id="contato-form">

        <h2>Login</h2>

        <input
            type="email"
            id="email"
            placeholder="Seu email"
            required
        >

        <input
            type="password"
            id="senha"
            placeholder="Sua senha"
            required
        >

        <button
            type="submit"
            class="btn"
        >
            Entrar
        </button>

        <p>
            Não tem conta?
            <a href="cadastro.html">Cadastre-se</a>
        </p>

    </form>


    <!-- JavaScript do login -->
    <script src="js/login.js"></script>
